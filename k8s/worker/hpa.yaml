apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurosynth-worker-hpa
  namespace: neurosynth
  labels:
    app.kubernetes.io/name: neurosynth-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurosynth-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Scale based on CPU (workers are CPU-bound during processing)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # For queue-based scaling, you need to set up a custom metrics adapter
    # like KEDA or prometheus-adapter. Example with KEDA:
    #
    # - type: External
    #   external:
    #     metric:
    #       name: redis_queue_length
    #       selector:
    #         matchLabels:
    #           queue: neurosynth-jobs
    #     target:
    #       type: AverageValue
    #       averageValue: "5"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
