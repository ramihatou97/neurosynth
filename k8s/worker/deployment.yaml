apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurosynth-worker
  namespace: neurosynth
  labels:
    app.kubernetes.io/name: neurosynth-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: neurosynth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neurosynth-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neurosynth-worker
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 300  # Allow jobs to complete
      containers:
        - name: worker
          image: neurosynth-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: neurosynth-config
            - secretRef:
                name: neurosynth-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: jobs-data
              mountPath: /data/jobs
            - name: worker-cache
              mountPath: /home/neurosynth/.neurosynth
      volumes:
        - name: jobs-data
          persistentVolumeClaim:
            claimName: jobs-pvc
        - name: worker-cache
          emptyDir: {}
