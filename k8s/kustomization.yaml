apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neurosynth

resources:
  - namespace.yaml
  - configmap.yaml
  # secrets.yaml should be created from template and applied separately
  - redis/deployment.yaml
  - redis/service.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - worker/deployment.yaml
  - worker/hpa.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "0.1.0"

# Image customization (override in overlays)
images:
  - name: neurosynth-api
    newTag: latest
  - name: neurosynth-worker
    newTag: latest
