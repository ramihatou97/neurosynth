apiVersion: v1
kind: Service
metadata:
  name: neurosynth-api
  namespace: neurosynth
  labels:
    app.kubernetes.io/name: neurosynth-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: neurosynth
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: neurosynth-api
---
