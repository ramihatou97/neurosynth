[tool.poetry]
name = "neurosynth"
version = "0.1.0"
description = "Neurosurgical Knowledge Synthesis System - Transform multiple reference sources into comprehensive chapters"
authors = ["Rami Hatoum"]
readme = "README.md"
packages = [{include = "neurosynth", from = "src"}]

[tool.poetry.scripts]
neurosynth = "neurosynth.cli:app"

[tool.poetry.dependencies]
python = "^3.11"

# Document Parsing
PyMuPDF = "^1.23.0"
pymupdf4llm = "^0.0.8"
ebooklib = "^0.18"
python-docx = "^1.1.0"
beautifulsoup4 = "^4.12.0"
lxml = "^4.9.0"

# LLM APIs
anthropic = "^0.39.0"
google-generativeai = "^0.8.0"
voyageai = "^0.2.0"

# ML/Embeddings (core)
numpy = "^1.26.0"
scikit-learn = "^1.4.0"

# LaTeX
Jinja2 = "^3.1.0"

# CLI & Utils
typer = {extras = ["all"], version = "^0.9.0"}
rich = "^13.7.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
tenacity = "^8.2.0"

# Async
aiofiles = "^23.2.0"
httpx = "^0.27.0"

# Optional: Visual processing (install with `pip install neurosynth[visual]`)
torch = {version = "^2.0.0", optional = true}
colpali-engine = {version = "^0.3.0", optional = true}
transformers = {version = "^4.40.0", optional = true}
pillow = {version = "^10.0.0", optional = true}
qdrant-client = {version = "^1.16.0", optional = true}

[tool.poetry.extras]
visual = ["torch", "colpali-engine", "transformers", "pillow", "qdrant-client"]
full = ["torch", "colpali-engine", "transformers", "pillow", "qdrant-client"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosynth"
version = "0.1.0"
description = "Neurosurgical Knowledge Synthesis System"
requires-python = ">=3.11"
dependencies = [
    # Document Parsing
    "PyMuPDF>=1.23.0",
    "pymupdf4llm>=0.0.8",
    "ebooklib>=0.18",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # LLM APIs
    "anthropic>=0.39.0",
    "google-generativeai>=0.8.0",
    "voyageai>=0.2.0",
    # ML/Embeddings (core)
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    # LaTeX
    "Jinja2>=3.1.0",
    # CLI & Utils
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    # Async
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# API service dependencies
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.6",
]
# Worker service dependencies
worker = [
    "redis>=5.0.0",
]
# Visual content processing with ColPali embeddings (~1.6GB)
visual = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "colpali-engine>=0.3.0",
    "pillow>=10.0.0",
    "qdrant-client>=1.16.0",
]
# Full installation with all features
full = [
    "neurosynth[api,worker,visual]",
]
# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
neurosynth = "neurosynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require real fixtures)",
    "slow: marks tests as slow-running (may take >10 seconds)",
]
testpaths = ["tests"]
addopts = [
    "--cov=src/neurosynth",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
