    # Medical-grade signal colors
    COLORS = {
        "HIGH": "#27ae60",         # Green: Clinical grade matches
        "MEDIUM": "#f39c12",       # Orange: Probable matches
        "LOW": "#e67e22",          # Dark Orange: Tenous links
        "INSUFFICIENT": "#c0392b"  # Red: Hallucination risk
    }

    # Unicode icons for immediate visual parsing
    ICONS = {
        "HIGH": "✅",
        "MEDIUM": "⚠️",
        "LOW": "❓",
        "INSUFFICIENT": "🚫"
    }

    def __init__(self, parent, **kwargs):
        super().__init__(parent, fg_color="transparent", **kwargs)

        # The badge container (pill shape)
        self.badge_bg = ctk.CTkFrame(
            self,
            corner_radius=12,
            fg_color="transparent" # Initially invisible
        )
