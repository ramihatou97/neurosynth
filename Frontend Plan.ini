```python
import customtkinter as ctk
from typing import Dict, Any, Optional

# Fallback for styles if not yet implemented
try:
    from .styles import FONTS, PADDING
except ImportError:
    FONTS = {
        "body": ("Helvetica", 13),
        "body_bold": ("Helvetica", 13, "bold"),
        "small": ("Helvetica", 11),
        "heading": ("Helvetica", 16, "bold")
    }
    PADDING = {"small": 5, "medium": 10}

class SearchPanel(ctk.CTkFrame):
    """
    Search input area with Deep-DX transparency features.

    New Capabilities:
    1. Collapsible 'Query Insights' drawer.
    2. Visualization of Query Expansion & Classification.
    3. Retrieval System Transparency metrics.
    """

    def __init__(self, parent, command=None, **kwargs):
        super().__init__(parent, fg_color="transparent", **kwargs)
        self.command = command # Callback function for executing search

        self._setup_ui()
        self._setup_insights_ui() # New Deep-DX components

    def _setup_ui(self):
        """Standard search input UI."""
        # Main container
        self.top_container = ctk.CTkFrame(self, fg_color="transparent")
        self.top_container.pack(fill="x", pady=(0, PADDING["small"]))

        # Search Bar
        self.search_entry = ctk.CTkEntry(
            self.top_container,
            placeholder_text="Enter clinical query (e.g., 'CP angle tumors treatment')...",
            font=FONTS["body"],
            height=40
        )
        self.search_entry.pack(side="left", fill="x", expand=True, padx=(0, PADDING["medium"]))
        self.search_entry.bind("<Return>", self._on_search)

        # Search Button
        self.search_btn = ctk.CTkButton(
            self.top_container,
            text="Search",
            font=FONTS["body_bold"],
            width=100,
            height=40,
            command=self._on_search
        )
        self.search_btn.pack(side="right")

        # Mode Toggle (Standard vs Deep Search)
        self.mode_var = ctk.StringVar(value="standard")
        self.mode_switch = ctk.CTkSwitch(
            self,
            text="Deep-DX Mode (AI Synthesis)",
            variable=self.mode_var,
            on_value="deep",
            off_value="standard",
            font=FONTS["small"]
        )
        self.mode_switch.pack(anchor="w", pady=(0, PADDING["small"]))

    def _setup_insights_ui(self):
        """
        The 'Black Box' decoder.
        Hidden by default, populated via show_query_insights().
        """
        # 1. The Container (Hidden initially)
        self.insights_frame = ctk.CTkFrame(self, fg_color="#1e1e1e", corner_radius=6)

        # 2. The Header (Always visible inside frame if frame is packed)
        header_frame = ctk.CTkFrame(self.insights_frame, fg_color="transparent", height=24)
        header_frame.pack(fill="x", padx=PADDING["medium"], pady=4)

        self.insights_toggle_lbl = ctk.CTkLabel(
            header_frame,
            text="▶ Query Insights", # Default state
            font=FONTS["small"],
            text_color="#a0a0a0",
            cursor="hand2"
        )
        self.insights_toggle_lbl.pack(side="left")
        self.insights_toggle_lbl.bind("<Button-1>", self._toggle_insights_content)

        # 3. The Content (Collapsible)
        self.insights_content = ctk.CTkFrame(self.insights_frame, fg_color="transparent")
        # Note: We don't pack content yet. _toggle_insights_content handles it.

        # -- Content Metrics --
        # Row 1: Classification
        self.query_type_lbl = ctk.CTkLabel(
            self.insights_content, text="Type: --", font=FONTS["small"], anchor="w"
        )
        self.query_type_lbl.pack(fill="x")

        # Row 2: Expansion (The "Did you mean?" equivalent)
        self.expansion_lbl = ctk.CTkLabel(
            self.insights_content,
            text="",
            font=FONTS["small"],
            text_color="#3498db", # Blue accent
            anchor="w"
        )
        self.expansion_lbl.pack(fill="x")

        # Row 3: Systems & Timing
        self.perf_lbl = ctk.CTkLabel(
            self.insights_content,
            text="",
            font=FONTS["small"],
            text_color="gray",
            anchor="w"
        )
        self.perf_lbl.pack(fill="x")

    def show_query_insights(self, data: Dict[str, Any]):
        """
        Populate the panel with data from the async backend.
        Triggered by app.py after search completes.
        """
        # 1. Reveal the main container
        self.insights_frame.pack(fill="x", pady=(0, PADDING["medium"]))

        # 2. Auto-expand if it's a Deep Search to show off the intelligence
        if self.mode_var.get() == "deep":
            self._expand_insights()

        # 3. Populate Data
        # Query Type
        q_type = data.get("query_type", "UNKNOWN").upper()
        self.query_type_lbl.configure(text=f"🎯 Classification: {q_type}")

        # Expansion (Show only if different from original)
        expanded = data.get("expanded_query")
        if expanded and expanded != self.search_entry.get():
            self.expansion_lbl.configure(text=f"✨ Expanded to: \"{expanded}\"")
            self.expansion_lbl.pack(fill="x") # Ensure visibility
        else:
            self.expansion_lbl.pack_forget() # Hide if no expansion needed

        # Performance Metrics
        systems = " + ".join([s.title() for s in data.get("systems_used", [])])
        latency = data.get("retrieval_time_ms", 0)
        self.perf_lbl.configure(text=f"⚙️ Pipeline: {systems}  |  ⏱️ Retrieval: {latency:.0f}ms")

    def hide_insights(self):
        """Reset and hide panel (e.g., on new search start)."""
        self.insights_frame.pack_forget()

    def _toggle_insights_content(self, event=None):
        """Handle manual toggle click."""
        if self.insights_content.winfo_ismapped():
            self._collapse_insights()
        else:
            self._expand_insights()

    def _expand_insights(self):
        self.insights_content.pack(fill="x", padx=16, pady=(0, 8))
        self.insights_toggle_lbl.configure(text="▼ Query Insights")

    def _collapse_insights(self):
        self.insights_content.pack_forget()
        self.insights_toggle_lbl.configure(text="▶ Query Insights")

    def _on_search(self, event=None):
        """Input handler."""
        query = self.search_entry.get().strip()
        if query and self.command:
            # Hide old insights immediately to indicate new processing
            self.hide_insights()
            # Execute callback (triggering app.py's _search_thread)
            self.command(query, self.mode_var.get())

    def focus_search(self):
        """Keyboard shortcut target."""
        self.search_entry.focus_set()
