        self.sw_vscroll.pack(anchor="w", pady=20)

        # Cache Size
        lbl_cache = ctk.CTkLabel(
            self.tab_perf,
            text="Image Cache Memory Limit (MB)",
            font=("Helvetica", 12, "bold")
        )
        lbl_cache.pack(anchor="w", pady=(10, 5))

        self.slider_cache = ctk.CTkSlider(
            self.tab_perf,
            from_=50, to=500, number_of_steps=9,
        )
        self.slider_cache.pack(fill="x", padx=20)

    def _setup_deepdx_tab(self):
        """Feature flags for the AI components."""
        ctk.CTkLabel(
            self.tab_deepdx,
            text="Transparency & Trust",
            font=("Helvetica", 14, "bold")
        ).pack(anchor="w", pady=(10, 10))

        self.var_show_badges = ctk.BooleanVar(value=True)
        ctk.CTkCheckBox(
            self.tab_deepdx,
            text="Show Confidence Badges (e.g., ✅ HIGH)",
            variable=self.var_show_badges
        ).pack(anchor="w", pady=5)

        self.var_show_insights = ctk.BooleanVar(value=True)
        ctk.CTkCheckBox(
            self.tab_deepdx,
            text="Show Query Insights Panel",
            variable=self.var_show_insights
        ).pack(anchor="w", pady=5)

        self.var_show_safety = ctk.BooleanVar(value=True)
        ctk.CTkCheckBox(
            self.tab_deepdx,
            text="Show Safety Critic Warnings",
            variable=self.var_show_safety,
            text_color="#e74c3c"
        ).pack(anchor="w", pady=5)

    def _load_current_values(self):
        """Populate widgets from config."""
        # Appearance
        current_theme = self.prefs.get("theme", "dark")
        self.var_theme.set(current_theme.title()) # Capitalize for display

        font_mod = self.prefs.get("font_size_modifier", 0)
        self.slider_font.set(font_mod)
        self.lbl_font_val.configure(text=f"Modifier: {int(font_mod)}")

        # Perf
        perf = self.config.get("performance", {})
        self.var_vscroll.set(perf.get("virtual_scrolling", True))

        # Deep-DX
        self.var_show_badges.set(self.prefs.get("show_confidence_badges", True))
        self.var_show_insights.set(self.prefs.get("show_query_insights", True))

    def _preview_theme(self, choice: str):
        """Apply theme immediately to see effect."""
        theme_key = choice.lower()
        ThemeManager.apply_theme(theme_key, self.parent)
        # Also apply to self (dialog)
        ThemeManager.apply_theme(theme_key, self)

    def _on_save(self):
        """Persist changes and close."""
        # 1. Update Config Dictionary
        self.prefs["theme"] = self.var_theme.get().lower()
        self.prefs["font_size_modifier"] = int(self.slider_font.get())

        self.prefs["show_confidence_badges"] = self.var_show_badges.get()
        self.prefs["show_query_insights"] = self.var_show_insights.get()

        self.config["performance"] = {
            "virtual_scrolling": self.var_vscroll.get(),
            "thumbnail_cache_size": int(self.slider_cache.get())
        }

        self.config["preferences"] = self.prefs

        # 2. Write to disk
        _save_user_config(self.config)

        # 3. Apply changes that require app refresh (like Fonts)
        # Note: Theme is already applied via preview
        # A full app restart might be needed for Fonts depending on implementation

        self.destroy()

    def _on_cancel(self):
        """Revert changes (if any previewed) and close."""
        # Revert theme if changed during preview
        original_theme = self.prefs.get("theme", "dark")
        ThemeManager.apply_theme(original_theme, self.parent)
        self.destroy()
