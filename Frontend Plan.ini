 Add responsive layout (new method):

 def __init__(self):
     # ... existing code ...
     self.bind("<Configure>", self._on_window_resize)
     self.layout_breakpoints = {
         "compact": 1200,   # < 1200px: Hide preview panel
         "normal": 1400,    # 1200-1600px: Standard layout
         "wide": 1600       # > 1600px: Expanded panels
     }
     self.current_layout = "normal"

 def _on_window_resize(self, event):
     """Adjust layout based on window width"""
     if event.widget != self:
         return

     width = event.width

     if width < self.layout_breakpoints["compact"]:
         new_layout = "compact"
     elif width > self.layout_breakpoints["wide"]:
         new_layout = "wide"
     else:
         new_layout = "normal"

     if new_layout != self.current_layout:
         self.current_layout = new_layout
         self._apply_responsive_layout(new_layout)

 def _apply_responsive_layout(self, layout: str):
     """Apply responsive layout changes"""
     if layout == "compact":
         self.preview_panel.pack_forget()
         self.results_tree.configure(width=800)
     elif layout == "wide":
         self.preview_panel.pack(side="right", fill="both", expand=False)
         self.results_tree.configure(width=900)
         self.preview_panel.configure(width=500)
     else:  # normal
         self.preview_panel.pack(side="right", fill="both", expand=False)
         self.results_tree.configure(width=700)
         self.preview_panel.configure(width=400)

