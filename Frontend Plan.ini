 class ConfidenceBadge(ctk.CTkFrame):
     """Visual confidence indicator"""

     COLORS = {
         "HIGH": "#27ae60",
         "MEDIUM": "#f39c12",
         "LOW": "#e67e22",
         "INSUFFICIENT": "#e74c3c"
     }

     ICONS = {
         "HIGH": "✅",
         "MEDIUM": "⚠️",
         "LOW": "⚠️",
         "INSUFFICIENT": "❌"
     }

     def __init__(self, parent, **kwargs):
         super().__init__(parent, fg_color="transparent", **kwargs)
         self.badge_label = ctk.CTkLabel(
             self, text="", font=FONTS["small_bold"],
             corner_radius=8, padx=6, pady=2
         )
         self.badge_label.pack()

     def set_confidence(self, level: str, percentage: int = None):
         icon = self.ICONS[level]
         color = self.COLORS[level]
