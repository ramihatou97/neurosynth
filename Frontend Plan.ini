 2. Implement virtual rendering (new methods)
 def __init__(...):
     self._viewport_start = 0
     self._viewport_size = 30  # Only render 30 items at once
     self._widget_pool = []    # Reusable widgets

 def _calculate_visible_range(self) -> tuple[int, int]:
     """Calculate which results should be visible"""
     scroll_pos = self.scrollable_frame._parent_canvas.yview()[0]
     start_idx = int(scroll_pos * len(self.results))
     end_idx = start_idx + self._viewport_size + 5  # Buffer
     return (start_idx, min(end_idx, len(self.results)))

 def _update_viewport(self):
     """Render only visible items, recycle widgets"""
     visible_start, visible_end = self._calculate_visible_range()

     # Create widget pool if needed
     if not self._widget_pool:
         self._widget_pool = [
             self._create_result_widget_template()
             for _ in range(self._viewport_size)
         ]

     # Update each widget with new data
     for i in range(visible_start, visible_end):
         if i >= len(self.results):
             break
         widget = self._widget_pool[i - visible_start]
         result_id = list(self.results.keys())[i]
         self._bind_result_to_widget(widget, result_id, self.results[result_id])
 3. Async thumbnail loading (replace lines 631-677)
 def _load_thumbnails_async(self, widget, result_id):
     """Load thumbnails in background thread"""
     import threading

     def worker():
         cache_key = f"thumb_{result_id}"

         # Check LRU cache
         if cache_key in self._thumbnail_cache:
             self._thumbnail_cache.move_to_end(cache_key)
             photos = self._thumbnail_cache[cache_key]
             self.after(0, lambda: self._apply_thumbnails(widget, photos))
             return

         # Generate thumbnails
         figures = self._item_figures.get(result_id, [])
         photos = []
         for fig in figures[:4]:
             img = Image.open(fig['image_path'])
             img.thumbnail((32, 32), Image.LANCZOS)
             photos.append(ImageTk.PhotoImage(img))

         # Cache with LRU eviction
         self._thumbnail_cache[cache_key] = photos
         if len(self._thumbnail_cache) > 200:
             self._thumbnail_cache.popitem(last=False)

         self.after(0, lambda: self._apply_thumbnails(widget, photos))

     threading.Thread(target=worker, daemon=True).start()
