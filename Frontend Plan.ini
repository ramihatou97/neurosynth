 def show_safety_warnings(self, critic_result: dict):
     """Display critic safety warnings"""
     if critic_result.get("safe", True):
         self.safety_frame.pack_forget()
         return

     issues = critic_result.get("issues", [])
     risk_level = critic_result.get("risk_level", "medium")

     risk_colors = {
         "low": "#3498db", "medium": "#f39c12",
         "high": "#e67e22", "critical": "#c0392b"
     }

     icon = {"low": "ℹ️", "medium": "⚠️", "high": "🚨", "critical": "🛑"}[risk_level]

     warning_text = f"{icon} {risk_level.upper()} RISK WARNINGS:\n"
     warning_text += "\n".join(f"• {issue}" for issue in issues)

     self.safety_label.configure(text=warning_text)
     self.safety_frame.configure(fg_color=risk_colors[risk_level])
     self.safety_frame.pack(fill="x", padx=PADDING["medium"], pady=PADDING["small"])

