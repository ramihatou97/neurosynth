 class KeyboardNavigationMixin:
     """Mixin to add comprehensive keyboard navigation"""

     SHORTCUTS = {
         "<Control-f>": "focus_search",
         "<Control-Return>": "execute_search",
         "<Up>": "navigate_prev_result",
         "<Down>": "navigate_next_result",
