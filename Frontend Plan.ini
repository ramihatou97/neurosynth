#### **Step 1: Update `RichResultsTree` API**

*Add these methods to `reference-library/src/ui/rich_results_tree.py` so the Mixin can call them:*

```python
    # ... inside RichResultsTree class ...

    def select_next(self):
        """Move selection down 1 row."""
        if not self.result_ids: return

        current_idx = -1
        if hasattr(self, 'selected_id') and self.selected_id in self.result_ids:
            current_idx = self.result_ids.index(self.selected_id)

        next_idx = min(len(self.result_ids) - 1, current_idx + 1)
        self._set_selection(self.result_ids[next_idx])
        self._ensure_visible(next_idx)

    def select_previous(self):
        """Move selection up 1 row."""
        if not self.result_ids: return

        current_idx = 0
        if hasattr(self, 'selected_id') and self.selected_id in self.result_ids:
            current_idx = self.result_ids.index(self.selected_id)

        prev_idx = max(0, current_idx - 1)
        self._set_selection(self.result_ids[prev_idx])
        self._ensure_visible(prev_idx)

    def get_selected_id(self):
        return getattr(self, 'selected_id', None)

    def _set_selection(self, result_id):
        self.selected_id = result_id
        # Trigger redraw to show highlight (handled in _bind_data_to_widget)
        self._update_viewport()
        # Callback to parent (handled by bindings usually, but method call here)
        self.event_generate("<<ResultSelected>>")

    def _ensure_visible(self, idx):
        """Scroll if selection moves out of viewport."""
        top_vis_idx, bot_vis_idx = self._calculate_visible_range()

        # Simple scroll-to logic
        if idx < top_vis_idx + 1:
            target = idx / len(self.result_ids)
            self.canvas.yview_moveto(target)
        elif idx > bot_vis_idx - 2:
            # Scroll so item is at bottom
            target = (idx - (bot_vis_idx - top_vis_idx) + 2) / len(self.result_ids)
            self.canvas.yview_moveto(target)
