```python
import customtkinter as ctk
import json
from pathlib import Path
from typing import Dict, Any, Optional
import structlog

# We assume config.py handles the actual file I/O
from ..config import _load_user_config, _save_user_config

logger = structlog.get_logger(__name__)

class ThemeManager:
    """
    Centralized theme management system.

    Responsibilities:
    1. Define color palettes (Dark, Light, High Contrast).
    2. Apply themes recursively to the widget tree.
    3. Persist user preference to config.
    4. Handle font scaling (Typography).
    """

    # ------------------------------------------------------------------
    # COLOR PALETTES
    # ------------------------------------------------------------------
    THEMES = {
        "dark": {
            "mode": "Dark", # CTk appearance mode
            "colors": {
                "bg_primary": "#2b2b2b",
                "bg_secondary": "#1e1e1e",
                "bg_tertiary": "#333333",
                "fg_text": "#ffffff",
                "fg_text_dim": "#a0a0a0",
                "accent": "#3498db",       # Standard Blue
                "accent_hover": "#2980b9",
                "success": "#27ae60",
                "warning": "#f39c12",
                "error": "#e74c3c",
                "border": "#404040"
            }
        },
        "light": {
            "mode": "Light",
            "colors": {
                "bg_primary": "#f5f5f5",
                "bg_secondary": "#ffffff",
                "bg_tertiary": "#e0e0e0",
                "fg_text": "#2c3e50",
                "fg_text_dim": "#7f8c8d",
                "accent": "#3498db",
                "accent_hover": "#2980b9",
                "success": "#27ae60",
                "warning": "#f39c12",
                "error": "#e74c3c",
                "border": "#dcdcdc"
            }
        },
        "high_contrast": {
            "mode": "Dark", # Base mode
            "colors": {
                "bg_primary": "#000000",
                "bg_secondary": "#000000",
                "bg_tertiary": "#1a1a1a",
                "fg_text": "#ffff00",      # Yellow on Black
                "fg_text_dim": "#00ff00",  # Green on Black
                "accent": "#00ffff",       # Cyan
                "accent_hover": "#00cccc",
                "success": "#00ff00",
                "warning": "#ff00ff",      # Magenta
                "error": "#ff0000",        # Red
                "border": "#ffffff"
            }
        }
    }

    @classmethod
    def load_theme(cls) -> str:
        """Load saved theme preference (default: dark)."""
        config = _load_user_config()
        return config.get("preferences", {}).get("theme", "dark")

    @classmethod
    def save_theme(cls, theme_name: str):
        """Save theme preference."""
        if theme_name not in cls.THEMES:
            logger.warning("invalid_theme_save_attempt", theme=theme_name)
            return

        config = _load_user_config()
        if "preferences" not in config:
            config["preferences"] = {}

        config["preferences"]["theme"] = theme_name
        _save_user_config(config)
        logger.info("theme_saved", theme=theme_name)

    @classmethod
    def apply_theme(cls, theme_name: str, app_instance: ctk.CTk):
        """
        Apply the selected theme to the application.

        Args:
            theme_name: 'dark', 'light', or 'high_contrast'
            app_instance: The root ctk.CTk window
        """
        if theme_name not in cls.THEMES:
            logger.error("unknown_theme", theme=theme_name)
            theme_name = "dark" # Fallback

        theme_data = cls.THEMES[theme_name]
        colors = theme_data["colors"]

        # 1. Set Global Appearance Mode (Light/Dark)
        # This handles standard CTk widgets automatically
        ctk.set_appearance_mode(theme_data["mode"])

        # 2. Update Custom Colors via Recursion
        # We walk the widget tree and update manual color overrides
        cls._recursive_update(app_instance, colors)

        # 3. Store current theme on the app instance for components to access
        app_instance.current_theme = colors
        app_instance.current_theme_name = theme_name

        logger.info("theme_applied", theme=theme_name)

    @classmethod
    def _recursive_update(cls, widget, colors: Dict[str, str]):
        """
        Walks the widget tree and updates colors based on widget type/tags.
        This allows hot-reloading without restarting the app.
        """
        try:
            # --- FRAMES ---
            if isinstance(widget, ctk.CTkFrame):
                # Heuristic: Determine if it's a primary or secondary background
                # (You might need custom tags in your widget classes for precision)
                current_fg = widget._fg_color
                if current_fg != "transparent":
                    # Default to secondary for panels
                    widget.configure(fg_color=colors["bg_secondary"])

            # --- LABELS ---
            elif isinstance(widget, ctk.CTkLabel):
                widget.configure(text_color=colors["fg_text"])

            # --- BUTTONS ---
            elif isinstance(widget, ctk.CTkButton):
                widget.configure(
                    fg_color=colors["accent"],
                    hover_color=colors["accent_hover"],
                    text_color="#ffffff" if colors["fg_text"] != "#ffff00" else "#000000"
                )

            # --- ENTRIES / TEXTBOXES ---
            elif isinstance(widget, (ctk.CTkEntry, ctk.CTkTextbox)):
                widget.configure(
                    fg_color=colors["bg_tertiary"],
                    text_color=colors["fg_text"],
                    border_color=colors["border"]
                )

            # --- SCROLLBARS ---
            elif isinstance(widget, ctk.CTkScrollbar):
                widget.configure(
                    button_color=colors["accent"],
                    button_hover_color=colors["accent_hover"]
                )

            # Recurse into children
            for child in widget.winfo_children():
                cls._recursive_update(child, colors)

        except Exception as e:
            # Swallow update errors to prevent UI crash during theme switch
            # logger.debug("theme_update_error", widget=widget, error=str(e))
            pass

    # ------------------------------------------------------------------
    # TYPOGRAPHY SCALING
    # ------------------------------------------------------------------
    @staticmethod
    def get_font_scale(modifier: int = 0) -> Dict[str, tuple]:
        """
        Generate font configuration with size modifier.
        modifier: -2 (tiny) to +4 (huge)
        """
        base_fonts = {
            "body": ("Helvetica", 13),
            "body_bold": ("Helvetica", 13, "bold"),
            "small": ("Helvetica", 11),
            "small_bold": ("Helvetica", 11, "bold"),
            "heading": ("Helvetica", 18, "bold"),
            "mono": ("Courier", 12)
        }

        scaled = {}
        for name, props in base_fonts.items():
            family = props[0]
            size = props[1]
            weight = props[2] if len(props) > 2 else "normal"

            # Apply scaling with a floor of 8px
            new_size = max(8, size + modifier)
            scaled[name] = (family, new_size, weight)

        return scaled
