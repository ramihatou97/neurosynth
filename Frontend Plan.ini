        self.label = ctk.CTkLabel(
            self.badge_bg,
            text="",
            font=FONTS["small_bold"],
            text_color="white",
            padx=8,
            pady=2
        )
        self.label.pack()

    def set_confidence(self, level: str, percentage: Optional[int] = None):
        """
        Update the badge state.

        Args:
            level: "HIGH", "MEDIUM", "LOW", or "INSUFFICIENT" (case-insensitive)
            percentage: Optional integer (0-100) to display alongside level
        """
        norm_level = level.upper()

        # 1. Get Style Configuration
        # Fallback to LOW if level is unrecognized
        color = self.COLORS.get(norm_level, self.COLORS["LOW"])
        icon = self.ICONS.get(norm_level, self.ICONS["LOW"])

        # 2. Construct Text
        text = f"{icon} {norm_level}"
        if percentage is not None:
            text += f" ({percentage}%)"

        # 3. Update UI
        self.badge_bg.configure(fg_color=color)
        self.label.configure(text=text)

        # Accessibility / Tooltip hook (placeholder)
        self.badge_bg.configure(height=24)

    def clear(self):
        """Hide the badge."""
        self.badge_bg.configure(fg_color="transparent")
        self.label.configure(text="")

