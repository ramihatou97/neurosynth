         "<Control-d>": "deselect_all_results",
         "<Control-comma>": "open_settings",
         "<Control-plus>": "increase_font_size",
         "<Control-minus>": "decrease_font_size",
         "<Escape>": "close_dialog",
     }

     def setup_keyboard_navigation(self):
         """Bind all keyboard shortcuts"""
         for key, action in self.SHORTCUTS.items():
             self.bind_all(key, lambda e, a=action: self._handle_shortcut(a, e))

     def _handle_shortcut(self, action: str, event):
         """Dispatch to handler"""
         handler_name = f"_kb_{action}"
         if hasattr(self, handler_name):
             getattr(self, handler_name)(event)
             return "break"

