 Task 3: Add FastAPI Lifespan Integration (1 day)

 File: api/app.py

 Problem: AsyncAIClient needs proper lifecycle management (connection pooling must be closed on shutdown).

 Solution: Use FastAPI's lifespan context manager.

 from contextlib import asynccontextmanager
 from ai.client import AsyncAIClient

 # Global AI client instance
 ai_client: AsyncAIClient = None

 @asynccontextmanager
 async def lifespan(app: FastAPI):
     """Manage AI client lifecycle."""
     global ai_client

     # Startup: Initialize persistent client
     logger.info("initializing_ai_client")
     ai_client = AsyncAIClient(
         voyage_api_key=settings.voyage_api_key,
         anthropic_api_key=settings.anthropic_api_key,
         timeout=60.0
     )

     yield  # Application runs

     # Shutdown: Close connections
     logger.info("shutting_down_ai_client")
     await ai_client.close()

 app = FastAPI(lifespan=lifespan)

 # Endpoints use the global client
 @app.post("/api/search/deep")
 async def deep_search(query: str):
     embedding = await ai_client.get_embedding(query)
     # ... rest of endpoint

 Benefits:
 - Connection pool reused across requests (faster, fewer connections)
 - Graceful shutdown (no connection leaks)
 - No per-request client creation overhead

