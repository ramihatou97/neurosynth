 import os
 import httpx
 from typing import List, Dict, Any
 from tenacity import (
     retry,
     stop_after_attempt,
     wait_exponential,
     retry_if_exception_type
 )
 import structlog

 logger = structlog.get_logger(__name__)

 class AsyncAIClient:
     """Production-ready async AI client with connection pooling and resilience."""

     def __init__(self, voyage_api_key: str = None, anthropic_api_key: str = None,
                  gemini_api_key: str = None, timeout: float = 60.0):
         self.voyage_key = voyage_api_key or os.getenv("VOYAGE_API_KEY")
         self.anthropic_key = anthropic_api_key or os.getenv("ANTHROPIC_API_KEY")
         self.gemini_key = gemini_api_key or os.getenv("GOOGLE_API_KEY")
         self.timeout = timeout

         # Persistent AsyncClient for connection pooling
         self.client = httpx.AsyncClient(
             timeout=self.timeout,
             limits=httpx.Limits(max_keepalive_connections=20, max_connections=100)
         )

     @retry(
         stop=stop_after_attempt(3),
         wait=wait_exponential(multiplier=1, min=2, max=10),
         retry=retry_if_exception_type((httpx.ConnectError, httpx.ReadTimeout, httpx.HTTPStatusError))
     )
     async def get_embeddings(self, texts: List[str], model: str = "voyage-large-2-instruct") -> List[List[float]]:
         """Get embeddings from Voyage AI (with retry)."""
         url = "https://api.voyageai.com/v1/embeddings"
         headers = {
             "Authorization": f"Bearer {self.voyage_key}",
             "Content-Type": "application/json"
         }
         logger.info("requesting_embeddings", provider="voyage", batch_size=len(texts), model=model)

         response = await self.client.post(
             url, headers=headers,
             json={"input": texts, "model": model, "input_type": "document"}
         )
         response.raise_for_status()
         data = response.json()

         logger.info("embeddings_received", count=len(data["data"]))
         return [item["embedding"] for item in data["data"]]

     async def get_embedding(self, text: str, model: str = "voyage-large-2-instruct") -> List[float]:
         """Get single embedding (convenience method)."""
         embeddings = await self.get_embeddings([text], model=model)
         return embeddings[0]

     @retry(
         stop=stop_after_attempt(3),
         wait=wait_exponential(multiplier=1, min=2, max=10),
         retry=retry_if_exception_type((httpx.ConnectError, httpx.ReadTimeout, httpx.HTTPStatusError))
     )
     async def synthesize(self, prompt: str, model: str = "claude-3-5-sonnet-20241022",
                         max_tokens: int = 2000, temperature: float = 0.0) -> str:
         """Generate text with Claude (with retry)."""
         url = "https://api.anthropic.com/v1/messages"
         headers = {
             "x-api-key": self.anthropic_key,
             "anthropic-version": "2023-06-01",
             "Content-Type": "application/json"
         }

         payload = {
             "model": model,
             "max_tokens": max_tokens,
             "temperature": temperature,
             "messages": [{"role": "user", "content": prompt}]
         }

         logger.info("requesting_synthesis", provider="anthropic", model=model, tokens=max_tokens)

         response = await self.client.post(url, headers=headers, json=payload)
         response.raise_for_status()
         data = response.json()

         text = data["content"][0]["text"]
         logger.info("synthesis_complete", tokens_used=data.get("usage", {}).get("output_tokens"))
         return text

     async def close(self):
         """Close the persistent HTTP client."""
         await self.client.aclose()
         logger.info("ai_client_closed")

     async def __aenter__(self):
         return self

     async def __aexit__(self, exc_type, exc_val, exc_tb):
         await self.close()

