Concerns & Risks ⚠️
1. Cascading Async Changes Underestimated
The plan says "All callers must become async" but doesn't fully trace the cascade:

AsyncAIClient
  ↓
DeepDxSynthesizer.generate_answer() → async
  ↓
PrecisionSearchEngine.retrieve_for_topic() → async (NOT MENTIONED!)
  ↓
ColBERT client calls → async
  ↓
RAPTOR indexer → async
  ↓
DeepDxCritic.check_safety() → async (mentioned)
Missing: PrecisionSearchEngine, ColBERT, RAPTOR also need async conversion.

2. Reference Library Event Loop Complexity
The proposed solution:

loop = asyncio.new_event_loop()
asyncio.set_event_loop(loop)
