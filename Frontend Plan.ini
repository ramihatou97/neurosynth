### **Phase 1: High-Performance `RichResultsTree`**

**File:** `reference-library/src/ui/rich_results_tree.py`

```python
import threading
import time
from collections import OrderedDict
from typing import Dict, List, Any, Optional
import tkinter as tk
import customtkinter as ctk
from PIL import Image, ImageTk, UnidentifiedImageError

# If you haven't created styles.py yet, use this fallback
try:
    from .styles import FONTS
except ImportError:
    FONTS = {
        "body": ("Helvetica", 13),
        "body_bold": ("Helvetica", 13, "bold"),
        "small": ("Helvetica", 11),
        "small_bold": ("Helvetica", 11, "bold"),
        "heading": ("Helvetica", 16, "bold")
    }

class RichResultsTree(ctk.CTkFrame):
    """
    High-performance result list with Virtual Scrolling and Async Loading.

    PERFORMANCE ARCHITECTURE:
    1. Virtual Rendering: Only creates widgets for visible items (Viewport).
    2. Widget Recycling: Reuses existing widgets instead of destroying/recreating.
    3. Async Thumbnails: Loads images in background threads to prevent UI freeze.
    4. LRU Cache: Keeps recent images in memory, evicts old ones to save RAM.
    """

    def __init__(self, parent, **kwargs):
        super().__init__(parent, fg_color="transparent", **kwargs)

        # Data storage
        self.results: Dict[str, Any] = {}
        self.result_ids: List[str] = [] # Ordered list of IDs for indexing
        self.figures_map: Dict[str, List[Dict]] = {} # id -> list of figure paths

        # Virtual Scrolling Config
        self.ROW_HEIGHT = 120  # Fixed height pixels (Critical for math)
        self.VIEWPORT_BUFFER = 5 # Extra items to render above/below viewport

        # Thumbnail Cache (LRU)
        self._thumbnail_cache = OrderedDict()
        self._cache_limit = 200

        # Setup UI
        self._setup_ui()

        # Scroll State
        self._last_scroll_pos = 0.0
        self._widget_pool = [] # List of reusable ResultRow widgets

        # Bind resize events to recalculate viewport
        self.bind("<Configure>", self._on_resize)

    def _setup_ui(self):
        """Initialize the scrollable container."""
        # We use a Canvas for precise scrolling control,
        # allowing us to simulate a massive height without massive memory usage.
        self.canvas = tk.Canvas(
            self,
            bg="#2b2b2b",
            bd=0,
            highlightthickness=0,
            yscrollcommand=lambda *args: self.scrollbar.set(*args)
        )
        self.scrollbar = ctk.CTkScrollbar(self, command=self.canvas.yview)

        self.canvas.pack(side="left", fill="both", expand=True)
        self.scrollbar.pack(side="right", fill="y")

        # Frame inside canvas to hold the reusable widgets
        # We don't pack widgets here; we use .place() for absolute positioning
        self.content_frame = tk.Frame(self.canvas, bg="#2b2b2b")
        self.canvas_window = self.canvas.create_window(
            (0, 0),
            window=self.content_frame,
            anchor="nw",
            tags="self.content_frame"
        )

        # Bind scroll event
        self.canvas.bind("<Configure>", self._on_configure)
        self.canvas.bind("<MouseWheel>", self._on_mousewheel)
        self.content_frame.bind("<Configure>", self._on_frame_configure)

        # Monitor scroll position
        self._monitor_scroll()

    def update_results(self, results: List[Any], figures: Dict[str, List[Dict]] = None):
        """Public API to load new results."""
        self.results = {r.source_id: r for r in results}
        self.result_ids = [r.source_id for r in results]
        self.figures_map = figures or {}

        # Calculate total virtual height
        total_height = len(self.results) * self.ROW_HEIGHT

        # Update canvas scroll region to "fake" the full size
        self.canvas.configure(scrollregion=(0, 0, self.winfo_width(), total_height))
        self.canvas.itemconfigure(self.canvas_window, height=total_height, width=self.winfo_width())

        # Force a refresh
        self._update_viewport()

    def _monitor_scroll(self):
        """Poller to detect scroll changes efficiently."""
        try:
            current_pos = self.canvas.yview()[0]
            if current_pos != self._last_scroll_pos:
                self._last_scroll_pos = current_pos
                self._update_viewport()
        except:
            pass
        # Check every 20ms (50fps)
        self.after(20, self._monitor_scroll)

    def _update_viewport(self):
        """
        THE MAGIC: Calculate which rows are visible and render ONLY those.
        Recycles widgets from self._widget_pool.
        """
        if not self.result_ids:
            return

        # 1. Calculate visible range indices
        view_top = self.canvas.yview()[0] * (len(self.result_ids) * self.ROW_HEIGHT)
        view_height = self.canvas.winfo_height()
        view_bottom = view_top + view_height

        start_idx = max(0, int(view_top // self.ROW_HEIGHT) - self.VIEWPORT_BUFFER)
        end_idx = min(len(self.result_ids), int(view_bottom // self.ROW_HEIGHT) + self.VIEWPORT_BUFFER)

        needed_widgets = end_idx - start_idx

        # 2. Expand pool if needed
        while len(self._widget_pool) < needed_widgets:
            widget = self._create_row_widget()
            self._widget_pool.append(widget)

        # 3. "Hide" unused widgets (move them off-screen)
        for widget in self._widget_pool[needed_widgets:]:
            widget.place(y=-5000) # Teleport off-screen

        # 4. Update and position active widgets
        for i, idx in enumerate(range(start_idx, end_idx)):
            widget = self._widget_pool[i]
            result_id = self.result_ids[idx]
            result = self.results[result_id]

            # Position precisely
            y_pos = idx * self.ROW_HEIGHT
            widget.place(x=0, y=y_pos, width=self.canvas.winfo_width(), height=self.ROW_HEIGHT)

            # Bind Data (Only update if data changed to save cycles)
            if getattr(widget, "current_id", None) != result_id:
                self._bind_data_to_widget(widget, result, result_id)

    def _create_row_widget(self):
        """Create a single reusable row template."""
        # Use a Frame wrapper
        frame = ctk.CTkFrame(self.content_frame, fg_color="#333333", corner_radius=6)

        # Layout: [Thumb] [Title/Text] [Meta]

        # Thumbnail Placeholder
        thumb_lbl = ctk.CTkLabel(frame, text="", width=80, height=80, fg_color="#444")
        thumb_lbl.place(x=10, y=10)
        frame.thumb_lbl = thumb_lbl # Store ref

        # Title
        title_lbl = ctk.CTkLabel(
            frame, text="", font=FONTS["body_bold"],
            text_color="#3498db", anchor="w"
        )
        title_lbl.place(x=100, y=10, relwidth=0.7)
        frame.title_lbl = title_lbl

        # Snippet
        text_lbl = ctk.CTkLabel(
            frame, text="", font=FONTS["small"],
            text_color="#cccccc", anchor="nw", justify="left", wraplength=500
        )
        text_lbl.place(x=100, y=35, relwidth=0.8, height=40)
        frame.text_lbl = text_lbl

        # Source ID (Meta)
        meta_lbl = ctk.CTkLabel(
            frame, text="", font=FONTS["small_bold"],
            text_color="#666", anchor="e"
        )
        meta_lbl.place(relx=0.95, y=10, anchor="ne")
        frame.meta_lbl = meta_lbl

        return frame

    def _bind_data_to_widget(self, widget, result, result_id):
        """Update a recycled widget with new data."""
        widget.current_id = result_id

        # Text Updates
        title = result.metadata.get("title", "Untitled Document")
        widget.title_lbl.configure(text=title)

        # Snippet truncation
        snippet = result.text[:200].replace("\n", " ") + "..."
        widget.text_lbl.configure(text=snippet)

        widget.meta_lbl.configure(text=f"ID: {result.source_id}")

        # Reset Thumbnail to placeholder immediately
        widget.thumb_lbl.configure(image=None, text="...", fg_color="#444")

        # Trigger Async Image Load
        self._load_thumbnail_async(widget, result_id)

    def _load_thumbnail_async(self, widget, result_id):
        """
        Thread-safe async image loader.
        Checks cache -> Loads from disk -> Updates UI via self.after
        """
        cache_key = f"thumb_{result_id}"

        # 1. Check Cache (Fast path)
        if cache_key in self._thumbnail_cache:
            self._thumbnail_cache.move_to_end(cache_key) # Mark used
            img = self._thumbnail_cache[cache_key]
            self._apply_thumbnail(widget, img, result_id)
            return

        # 2. Worker Thread (Slow path)
        def worker():
            try:
                figures = self.figures_map.get(result_id, [])
                if not figures:
                    return # No image

                # Load first image
                img_path = figures[0].get("image_path")
                if not img_path:
                    return

                pil_img = Image.open(img_path)
                pil_img.thumbnail((80, 80)) # Resize
                ctk_img = ctk.CTkImage(light_image=pil_img, dark_image=pil_img, size=(80, 80))

                # Schedule update on main thread
                self.after(0, lambda: self._cache_and_apply(widget, ctk_img, result_id, cache_key))

            except Exception as e:
                # print(f"Error loading thumb: {e}")
                pass

        threading.Thread(target=worker, daemon=True).start()

    def _cache_and_apply(self, widget, img, result_id, cache_key):
        """Runs on Main Thread: Update cache and UI"""
        # Update Cache
        self._thumbnail_cache[cache_key] = img
        if len(self._thumbnail_cache) > self._cache_limit:
            self._thumbnail_cache.popitem(last=False) # Evict oldest

        self._apply_thumbnail(widget, img, result_id)

    def _apply_thumbnail(self, widget, img, result_id):
        """Final UI update (Must check if widget is still showing this result!)"""
        if getattr(widget, "current_id", None) == result_id:
            widget.thumb_lbl.configure(image=img, text="")

    # Event Handlers
    def _on_mousewheel(self, event):
        self.canvas.yview_scroll(int(-1*(event.delta/120)), "units")

    def _on_resize(self, event):
        self._update_viewport()

    def _on_configure(self, event):
        self.canvas.itemconfigure(self.canvas_window, width=event.width)

    def _on_frame_configure(self, event):
        self.canvas.configure(scrollregion=self.canvas.bbox("all"))

```

### **Why this works (The Math)**

1.  **Fixed Row Height (`120px`)**: This is the constraint that makes virtual scrolling possible. Because we know every row is 120px, we can calculate exactly which items are visible at `scroll_y = 5000` without rendering the previous 49 rows.
      * `start_index = scroll_y / 120`
2.  **`place()` vs `pack()`**: Standard `pack()` tries to reflow layout every time you add a widget. By using `place(y=...)` inside the `canvas`, we manually control the position, which is much faster for the rendering engine.
3.  **Widget Recycling**: As you scroll down, the widget that *was* displaying "Result \#1" is moved to the bottom and updated to display "Result \#31". We never destroy the widget object, saving massive overhead.

