class NeurosurgeryLibraryApp(ctk.CTk, KeyboardNavigationMixin): # NEW INHERITANCE
    def __init__(self):
        super().__init__()

        # ... [Phase 0 Async Setup] ...

        # ---------------------------------------------------------
        # PHASE 3: KEYBOARD SHORTCUTS
        # ---------------------------------------------------------
        self.setup_keyboard_shortcuts()

        # ---------------------------------------------------------
        # PHASE 4: RESPONSIVE LAYOUT
        # ---------------------------------------------------------
        self.bind("<Configure>", self._on_window_resize)
        self.layout_mode = "normal"
        self.breakpoints = {"compact": 1100, "wide": 1600}

    def _on_window_resize(self, event):
        """Responsive layout logic."""
        if event.widget != self: return # Ignore child events

        width = event.width
        new_mode = "normal"

        if width < self.breakpoints["compact"]:
            new_mode = "compact"
        elif width > self.breakpoints["wide"]:
            new_mode = "wide"

        if new_mode != self.layout_mode:
            self.layout_mode = new_mode
            self._apply_responsive_layout(new_mode)

    def _apply_responsive_layout(self, mode):
        """
        Adjust panel visibility based on window size.
        compact: Hide preview panel (overlay mode or separate window)
        normal: Standard 2-pane
        wide: Expanded preview panel
        """
        if mode == "compact":
            # Hide preview, maximize results
            if self.preview_panel.winfo_ismapped():
                self.preview_panel.pack_forget()
        else:
            # Show preview
            if not self.preview_panel.winfo_ismapped():
                self.preview_panel.pack(side="right", fill="y", expand=False)

