### **Phase 3, Task 3: Keyboard Navigation**

**File:** `reference-library/src/ui/keyboard_nav_mixin.py`

```python
import customtkinter as ctk
from typing import Any

class KeyboardNavigationMixin:
    """
    Adds power-user keyboard shortcuts to the application.

    Shortcuts:
    - Ctrl+F: Focus Search
    - Up/Down: Navigate Results
    - Enter: Open Selected Result
    - Space: Toggle Selection
    - Ctrl+,: Open Settings
    - Esc: Clear Selection / Close Dialogs
    """

    def setup_keyboard_shortcuts(self):
        """Register global event bindings."""
        # Navigation
        self.bind("<Up>", self._kb_nav_up)
        self.bind("<Down>", self._kb_nav_down)
        self.bind("<Return>", self._kb_enter)
        self.bind("<space>", self._kb_space)
        self.bind("<Escape>", self._kb_escape)

        # Actions
        self.bind("<Control-f>", self._kb_focus_search)
        self.bind("<Control-comma>", self._kb_open_settings)

        # Zoom (Typography scaling)
        self.bind("<Control-plus>", lambda e: self._adjust_zoom(1))
        self.bind("<Control-minus>", lambda e: self._adjust_zoom(-1))

    def _kb_focus_search(self, event=None):
        """Ctrl+F: Focus the search bar."""
        if hasattr(self, 'search_panel'):
            self.search_panel.focus_search()
        return "break" # Stop event propagation

    def _kb_open_settings(self, event=None):
        """Ctrl+,: Open settings dialog."""
        # Avoid opening duplicates
        for widget in self.winfo_children():
            if isinstance(widget, ctk.CTkToplevel) and widget.title() == "Settings":
                widget.lift()
                return

        # Import dynamically to avoid circular imports
        from .settings_dialog import SettingsDialog
        SettingsDialog(self)

    def _kb_nav_up(self, event=None):
        """Up Arrow: Select previous result."""
        if self._is_focus_in_input(event): return

        if hasattr(self, 'results_tree'):
            # Delegate to RichResultsTree's internal selection logic
            self.results_tree.select_previous()

    def _kb_nav_down(self, event=None):
        """Down Arrow: Select next result."""
        if self._is_focus_in_input(event): return

        if hasattr(self, 'results_tree'):
            self.results_tree.select_next()

    def _kb_enter(self, event=None):
        """Enter: Open/Preview selected result."""
        if self._is_focus_in_input(event): return

        if hasattr(self, 'results_tree'):
            selected_id = self.results_tree.get_selected_id()
            if selected_id:
                # Trigger the preview logic in App
                self._on_result_selected(selected_id)

    def _kb_space(self, event=None):
        """Space: Toggle checkbox/selection state."""
        if self._is_focus_in_input(event): return
        # Placeholder for multi-select logic

    def _kb_escape(self, event=None):
        """Esc: Clear selection or close overlays."""
        # Close settings if open
        for widget in self.winfo_children():
            if isinstance(widget, ctk.CTkToplevel):
                widget.destroy()
                return

        # Clear focus
        self.focus_set()

    def _adjust_zoom(self, direction: int):
        """Ctrl +/-: Adjust global font size modifier."""
        # This requires the ThemeManager to reload fonts
        # In a full impl, this would update config and refresh UI
        pass

    def _is_focus_in_input(self, event) -> bool:
        """Prevent navigation keys from hijacking text entry."""
        if not event: return False
        try:
            widget = event.widget
            # Check if focused widget is an Entry or Textbox
            if isinstance(widget, (ctk.CTkEntry, ctk.CTkTextbox,
                                 # Check standard TK widgets too if used underneath
                                 )):
                return True
        except:
            pass
        return False
