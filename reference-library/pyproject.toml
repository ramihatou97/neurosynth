[project]
name = "neurosynth-reference-library"
version = "0.1.0"
description = "Reference library search and synthesis for neurosurgery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NeuroSynth Team"}
]
keywords = ["neurosurgery", "reference", "search", "pdf", "ai", "synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "customtkinter>=5.2.0",
    "pymupdf>=1.26.0",
    "anthropic>=0.39.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "fpdf2>=2.7.0",
    "jinja2>=3.1.0",
    "watchdog>=3.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
visual = [
    "colpali-engine>=0.1.0",
    "qdrant-client>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
neuro-ref = "main:main"

[project.urls]
Homepage = "https://github.com/neurosynth/reference-library"
Documentation = "https://github.com/neurosynth/reference-library#readme"
Repository = "https://github.com/neurosynth/reference-library"
Issues = "https://github.com/neurosynth/reference-library/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.setuptools.package-data]
"*" = ["templates/*", "data/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
